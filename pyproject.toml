[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk3588-edge-vision"
version = "0.1.0"
description = "RK3588 airborne target detection, tracking, and safety orchestration skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edge-vision-demo = "edge_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
